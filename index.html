<style>
:root{--bg:#f2f2ee;--fg:#1c1c1a;--bt:#fff;--bd:#c9c9c2;--ac:#1d7a46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#bar{flex:none;display:flex;gap:6px;padding:6px;justify-content:center;overflow-x:auto}

#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

#spin{position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d6d6cc);border:1px solid var(--bd);touch-action:none}
#spin:before,#spin:after{content:'';position:absolute;background:rgba(0,0,0,.22)}
#spin:before{left:6px;right:6px;top:50%;height:1px}
#spin:after{top:6px;bottom:6px;left:50%;width:1px}

#spinov,#setov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20;touch-action:none}

.pp.act{background:linear-gradient(var(--bt),var(--bt)) padding-box,conic-gradient(from 0deg,transparent var(--t,0deg),var(--tc,#34d27b) var(--t,0deg)) border-box}
.pn{font-style:normal;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}

.mb{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),rgba(255,255,255,0) 45%,rgba(0,0,0,.4)),var(--c)}
.mb.st{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),rgba(255,255,255,0) 45%,rgba(0,0,0,.4)),linear-gradient(#f5f5f0 0 26%,var(--c) 26% 74%,#f5f5f0 74%)}

#ropts{display:flex;flex-direction:column;gap:8px}

#menu{background:radial-gradient(ellipse at 50% 35%,#21a066,#0c5233 55%,#041f15);overflow:hidden}

#mcont{position:relative;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
#mt{margin:0;line-height:.95;font-size:clamp(30px,10vmin,66px);font-weight:900;letter-spacing:1px;text-shadow:0 4px 24px rgba(0,0,0,.45)}
#mt b{display:block;font-size:.62em;background:linear-gradient(90deg,#ffd24a,#ff7a59);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
#msub{margin:0 0 6px;opacity:.85;font-size:14px}
.big{min-width:210px;padding:14px 26px;border:0;border-radius:40px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(#34d27b,#16a35a);box-shadow:0 5px 0 #0e7a41,0 10px 24px rgba(0,0,0,.35);cursor:pointer;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #0e7a41}

.big:disabled{opacity:.45}
#lbox,#obox{width:min(92%,520px);max-height:94%;overflow:auto;background:rgba(10,42,29,.94);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:14px 16px;color:#fff;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
#obox{align-items:center;text-align:center}
#lhead{display:flex;align-items:center;gap:10px}
#lhead h2{margin:0;flex:1;font-size:19px}
#lbox label{display:flex;flex-direction:column;gap:4px;font-size:12px;opacity:.9}
#lbox input{font-size:16px;padding:9px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;user-select:text;-webkit-user-select:text;min-width:0}
#lbox section{display:none;flex-direction:column;gap:10px;align-items:stretch}
#lbox section.on{display:flex}
#v-home.on{flex-direction:row;justify-content:center;flex-wrap:wrap}
#lbox .big{min-width:0;font-size:17px;padding:11px 22px}
#lstat{min-height:0;font-size:13px;color:#ffd24a}
#llist{display:flex;flex-direction:column;gap:6px;max-height:34vmin;overflow:auto;font-size:14px}
.li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.1);cursor:pointer}

#lpwbox{display:none;gap:8px}
#rinfo{font-size:18px;font-weight:800}
#rplayers{white-space:pre-line;line-height:1.5}

</style></head><body>
<div id="app">
<div id="bar"><div id="hud"><b id="h1"></b><div id="hrow"><div class="pp" id="pme"><i class="pn"></i><i class="pb"></i></div><div class="pp" id="pop"><i class="pn"></i><i class="pb"></i></div></div><small id="h2"></small></div><button id="ch" class="on">Cheat: ON</button><button id="un">Undo</button><button id="rs">Reset</button><button id="mv">Move: OFF</button><button id="sn" class="on">Sound</button><div id="spin" title="Spin: where the cue hits the ball"><i id="spd"></i></div><button id="gear" title="Settings">&#9881;&#xFE0E;</button><button id="mn">Menu</button></div>
<div id="wrap"><div id="row">

</div></div>

<label id="rowcs"><span>Cue power <b id="csv">1.0&times;</b></span><input id="cs" type="range" min="10" max="30" value="10"></label>

<section id="v-room"><div id="rinfo"></div><div id="rplayers"></div><div id="ropts"><label><span>Allow cheats (both players)</span><input id="ocheat" type="checkbox"></label><label><span>Ice table</span><input id="oice" type="checkbox"></label><label><span>Turn by turn (turn passes after every shot)</span><input id="otbt" type="checkbox"></label><label><span>Turn timer</span><select id="otimer"><option value="normal">Normal (60s)</option><option value="rapid">Rapid (12s)</option></select></label><label><span>Forced trick shots (bank off a far wall)</span><input id="otrick" type="checkbox"></label></div><button class="big" id="rstart">Start</button><div id="rmsg"></div></section>
</div></div>

<script>
const W=880,H=440,R=10,M=40,LW=W+2*M,LH=H+2*M,DT=1/240,STOP=5,EB=.96,GP=18,AE=2400,ZD=.6,MC=.2,MB=.06,EC=.78,VMAX=1800;
let FC=.6,FA=20,MAXS=240*14,CS=1,ICE=false,KEEP=false,shotPv=null;
const PK=[[0,0,20],[W,0,20],[0,H,20],[W,H,20],[W/2,-11,19],[W/2,H+11,19]];
const TIPS=[[W/2-GP,0],[W/2+GP,0],[W/2-GP,H],[W/2+GP,H]];
const COL=['#f5f5f0','#f2c500','#1f4fd8','#d62828','#7b2cbf','#f77f00','#1b9a4a','#8c1c13','#161616','#f2c500','#1f4fd8','#d62828','#7b2cbf','#f77f00','#1b9a4a','#8c1c13'];
const $=id=>document.getElementById(id);let cv=$('c'),cx=cv.getContext('2d');
let balls,undo=null,cheat=true,moveMode=false,rolling=false,ang=0,dirty=true,pv=null,drag=null,ag=null,s=1,rot=false,dpr=1,OX=0,OY=0,P=1,net=null,shotEv=[],st=null,sd=null,fx=[],mute=false,evs=[];
const mk=(id,x,y)=>({id,x,y,vx:0,vy:0,out:false,lx:x,ly:y,qw:1,qx:0,qy:0,qz:0,sx:0,sy:0,sz:0});
function rack(){
  balls=[mk(0,W*.25,H/2)];
  const q=[1,9,2,10,8,3,11,4,12,6,5,13,7,14,15];let k=0;
  for(let r=0;r<5;r++)for(let i=0;i<=r;i++)balls.push(mk(q[k++],W*.7+r*(R*1.7320508+.3),H/2+(i-r/2)*(2*R+.6)));
  rolling=false;st=null;fx=[];undo=null;dirty=true;
}
// One physics step. Used by BOTH the live game and the preview, so they always agree.
// Spin model (simplified): extra top/back spin (sx,sy) turns into a push when the ball hits another ball (follow / draw),
// side spin (sz) grips the cushion and the other ball (english / throw). With no spin selected nothing changes.
function strike(c,p){const sp=VMAX*CS*p,dx=Math.cos(ang),dy=Math.sin(ang);c.vx=dx*sp;c.vy=dy*sp;c.sx=dx*1.25*OY*sp;c.sy=dy*1.25*OY*sp;c.sz=-1.25*OX*sp}
function cush(b,nx,ny,vn){
  if(!b.sz)return;
  const J=Math.sign(b.sz)*Math.min(Math.abs(b.sz)/3.5,MC*(1+EC)*Math.max(0,vn));
  b.vx-=J*ny;b.vy+=J*nx;b.sz-=2.5*J;
}
function spinHit(a,b,nx,ny,j2){
  for(const k of [a,b])if(k.sx||k.sy){k.vx+=k.sx/3.5;k.vy+=k.sy/3.5;k.sx=k.sy=0}
  if(a.sz||b.sz){
    const L=MB*j2,J=Math.max(-L,Math.min(L,-(a.sz+b.sz)/7));
    a.vx-=J*ny;a.vy+=J*nx;b.vx+=J*ny;b.vy-=J*nx;a.sz+=2.5*J;b.sz+=2.5*J;
  }
}
function sub(bs,ev,dt){
  for(const b of bs){
    if(b.out||!(b.vx||b.vy))continue;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy),n=sp*(1-FC*dt)-FA*dt;
    if(n<=STOP){b.vx=b.vy=b.sx=b.sy=b.sz=0}else{const k=n/sp;b.vx*=k;b.vy*=k;
      if(b.sx||b.sy){const m=Math.sqrt(b.sx*b.sx+b.sy*b.sy),m2=m-AE*dt;if(m2<=0){b.sx=b.sy=0}else{b.sx*=m2/m;b.sy*=m2/m}}
      if(b.sz){b.sz*=1-ZD*dt;if(Math.abs(b.sz)<2)b.sz=0}}
    for(const p of PK){const dx=b.x-p[0],dy=b.y-p[1];if(dx*dx+dy*dy<p[2]*p[2]){if(ev)ev.push([2,sp,b.id,p[0],p[1],b.x,b.y]);b.out=true;b.vx=b.vy=0;break}}
    if(b.out)continue;
    if(b.x<R){const q=-b.vx;if(ev){if(q>0)ev.push([4,b.id,0,q]);if(q>40)ev.push([1,q])}b.x=R;b.vx=Math.abs(b.vx)*EC;cush(b,1,0,q)}else if(b.x>W-R){const q=b.vx;if(ev){if(q>0)ev.push([4,b.id,1,q]);if(q>40)ev.push([1,q])}b.x=W-R;b.vx=-Math.abs(b.vx)*EC;cush(b,-1,0,q)}
    if(Math.abs(b.x-W/2)>=GP){
      if(b.y<R){const q=-b.vy;if(ev){if(q>0)ev.push([4,b.id,2,q]);if(q>40)ev.push([1,q])}b.y=R;b.vy=Math.abs(b.vy)*EC;cush(b,0,1,q)}else if(b.y>H-R){const q=b.vy;if(ev){if(q>0)ev.push([4,b.id,3,q]);if(q>40)ev.push([1,q])}b.y=H-R;b.vy=-Math.abs(b.vy)*EC;cush(b,0,-1,q)}
    }
    for(const q of TIPS){
      const dx=b.x-q[0],dy=b.y-q[1],d2=dx*dx+dy*dy;
      if(d2<R*R&&d2>0){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;b.x=q[0]+nx*R;b.y=q[1]+ny*R;const vn=b.vx*nx+b.vy*ny;
        if(vn<0){if(ev){ev.push([4,b.id,4,-vn]);if(vn<-40)ev.push([1,-vn])}b.vx-=(1+EC)*vn*nx;b.vy-=(1+EC)*vn*ny}}
    }
  }
  for(let i=0;i<bs.length;i++){
    const a=bs[i];if(a.out)continue;
    for(let j=i+1;j<bs.length;j++){
      const b=bs[j];if(b.out||!(a.vx||a.vy||b.vx||b.vy))continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2>=4*R*R||d2===0)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(2*R-d)/2;
      a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
      const vn=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(vn>0){if(ev){if(vn>30)ev.push([0,vn]);if(a.id===0||b.id===0)ev.push([3,a.id===0?b.id:a.id])}const j2=(1+EB)/2*vn;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny;if(a.sx||a.sy||b.sx||b.sy||a.sz||b.sz)spinHit(a,b,nx,ny,j2)}
    }
  }
  for(const b of bs)if(!b.out&&(b.vx||b.vy))return true;
  return false;
}
// Adaptive sub-stepping: fast balls get smaller time steps so collisions stay accurate.
function step(bs,ev){
  let v=0;
  for(const b of bs)if(!b.out){const q=b.vx*b.vx+b.vy*b.vy;if(q>v)v=q}
  const n=Math.min(8,Math.max(1,Math.ceil(Math.sqrt(v)*DT/1)));
  let m=false;
  for(let i=0;i<n;i++)m=sub(bs,ev,DT/n);
  return m;
}
function preview(){
  const sim=balls.map(b=>({...b})),c=sim[0];
  if(c.out)return null;
  strike(c,P);
  const T=sim.map(b=>[[b.x,b.y]]);
  const rec=()=>sim.forEach((b,i)=>{const p=T[i],l=p[p.length-1];
    if((!b.out||!b.rd)&&Math.hypot(b.x-l[0],b.y-l[1])>=2){p.push([b.x,b.y]);if(b.out)b.rd=1}});
  for(let n=1;n<=MAXS;n++){const m=step(sim);if(n%3===0||!m)rec();if(!m)break}
  return{P:T,sim};
}
function settle(){
  const c=balls[0];
  if(c.out){c.out=false;c.vx=c.vy=0;let x=W*.25;c.x=x;c.y=H/2;
    while(x>R+1&&balls.some(b=>b!==c&&!b.out&&Math.hypot(b.x-x,b.y-c.y)<2*R+1)){x-=R;c.x=x}}
  dirty=true;
}
function fire(p){

  const o=net.opAim||(net.opAim={sa:m.a,sp:m.p});

  if(net.inHand&&m.c&&!balls[0].out){balls[0].x=m.c[0];balls[0].y=m.c[1]}
}
function aimTick(nowT){
  if(rolling&&net&&net.opAim)net.opAim=null;
  if(rolling&&net&&net.brk)net.brk=false;
  if(net&&net.playing&&!net.over&&!rolling&&canAct()&&!balls[0].out){
    const pp=(sd||st)?P:.1,moved=Math.abs(ang-aimA)>1e-4||Math.abs(pp-aimP)>.004;
    if(nowT-aimT>(moved?90:600)){aimT=nowT;aimA=ang;aimP=pp;sendAim(ang,pp)}
  }
  if(net&&net.opAim){const o=net.opAim;let d=o.a-o.sa;d=Math.atan2(Math.sin(d),Math.cos(d));o.sa+=d*.35;o.sp+=(o.p-o.sp)*.35}
  if(net&&net.playing){const sg=balls.map(b=>b.out?1:0).join('');if(sg!==hudSig){hudSig=sg;hudUpdate()}}
}
// ---- shots over the network ----
function netShot(c){
  net.inHand=false;net.pre={};balls.forEach(b=>{net.pre[b.id]=b.out});shotEv=[];net.seq++;
  const m={t:'shot',seq:net.seq,v:[c.vx,c.vy,c.sx,c.sy,c.sz],cue:[c.x,c.y]};
  if(net.me==='host')net.cl.publish(NP+'out/'+net.id,JSON.stringify(m),{qos:1});else sendIn(m);
}
function startRemote(m){
  if(!net.playing||net.over||rolling||net.turn===net.me||m.seq<=net.seq)return;
  net.seq=m.seq;const c=balls[0];
  c.x=m.cue[0];c.y=m.cue[1];c.out=false;c.vx=m.v[0];c.vy=m.v[1];c.sx=m.v[2];c.sy=m.v[3];c.sz=m.v[4];
  net.pre={};balls.forEach(b=>{net.pre[b.id]=b.out});shotEv=[];net.inHand=false;rolling=true;snd(3,.7);
}
function netShotEnd(){
  if(net.me==='host'){const r=judgeNet();applyResult(r);net.cl.publish(NP+'out/'+net.id,JSON.stringify(r),{qos:1})}
  else if(net.pending){const r=net.pending;net.pending=null;applyResult(r)}
  else{net.waiting=true;net.wsince=Date.now()}
}
function onResult(r){
  if(net.me!=='guest'||r.seq<net.seq)return;
  if(rolling)net.pending=r;else{net.waiting=false;applyResult(r)}
}
function endShot(){if(net)netShotEnd();else settle()}
// ---- connection ----
function loadMqtt(){return new Promise((res,rej)=>{if(window.mqtt)return res();const s=document.createElement('script');s.src=MQTT_SRC;s.onload=()=>window.mqtt?res():rej(new Error('mqtt'));s.onerror=()=>rej(new Error('mqtt'));document.head.appendChild(s)})}
function getClient(will){
  return loadMqtt().then(()=>new Promise((res,rej)=>{
    let i=0;
    const next=()=>{
      if(i>=BROKERS.length)return rej(new Error('offline'));
      const o={clientId:'bwc'+rnd(10),clean:true,reconnectPeriod:2500,connectTimeout:7000,keepalive:30};
      if(will)o.will=will;
      const cl=window.mqtt.connect(BROKERS[i++],o);let done=false;
      const t=setTimeout(()=>{if(!done){done=true;cl.end(true);next()}},8000);
      cl.on('error',()=>{});
      cl.once('connect',()=>{if(done)return;done=true;clearTimeout(t);cl.on('message',route);res(cl)});
    };
    next();
  }));
}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
function route(topic,buf){
  let m=null;try{m=JSON.parse(buf.toString())}catch(e){}
  const p=topic.slice(NP.length).split('/');
  if(p[0]==='lobbies'){
    if(!buf.length)br.map.delete(p[1]);else if(m){m.seen=Date.now();br.map.set(p[1],m)}
    if(view==='list')renderList();return;
  }
  if(!net||!m||p[1]!==net.id)return;
  if(p[0]==='in'&&net.me==='host')hostMsg(m);
  else if(p[0]==='join'&&net.me==='guest')guestJoinMsg(m);
  else if(p[0]==='out'&&net.me==='guest')guestMsg(m);
}
const sendIn=o=>net.cl.publish(NP+'in/'+net.id,JSON.stringify(Object.assign({cid:net.cid},o)),{qos:1});
const sendOut=o=>net.cl.publish(NP+'out/'+net.id,JSON.stringify(o),{qos:1});
function pubLobby(){
  if(!net||net.me!=='host')return;
  net.cl.publish(NP+'lobbies/'+net.id,JSON.stringify({id:net.id,name:net.lname,host:net.names.host,lock:net.lock,n:net.guest?2:1,st:net.playing?'playing':'open',ts:Date.now()}),{qos:1,retain:true});
}
function tick(){
  if(!net)return;
  if(net.me==='host'){if(net.guest){sendOut({t:'hb'});if(Date.now()-net.last>30000)guestGone('disconnected')}}
  else{
    sendIn({t:'hb'});
    if(net.waiting&&Date.now()-net.wsince>5000){net.wsince=Date.now();sendIn({t:'sync'})}
    if(Date.now()-net.last>30000)hostGone('disconnected');
  }
}
function hostMsg(m){
  if(m.t==='join'){
    const deny=why=>net.cl.publish(NP+'join/'+net.id+'/'+m.cid,JSON.stringify({t:'deny',why}),{qos:1});
    if((net.guest&&net.guest.cid!==m.cid)||net.playing)return deny('That lobby is full.');
    if(net.pwh&&m.pw!==net.pwh)return deny('Wrong password.');
    net.guest={cid:m.cid};net.names.guest=String(m.name||'Player').slice(0,16);net.last=Date.now();
    net.cl.publish(NP+'join/'+net.id+'/'+m.cid,JSON.stringify({t:'accept',host:net.names.host}),{qos:1});
    pubLobby();roomUI();sendOut({t:'opts',opts:net.opts||{cheats:false,ice:false}});return;
  }
  if(!net.guest||m.cid!==net.guest.cid)return;
  net.last=Date.now();
  if(m.t==='leave')guestGone('left');
  else if(m.t==='aim')gotAim(m);
  else if(m.t==='shot')startRemote(m);
  else if(m.t==='sync'&&!rolling&&!net.over)sendOut({t:'result',seq:net.seq,balls:balls.map(b=>[b.id,b.x,b.y,b.out?1:0]),turn:net.turn,groups:net.groups,inHand:net.inHand,winner:null,msg:net.msg,over:false});
}
function guestJoinMsg(m){
  if(m.t==='accept'){net.joined=true;clearTimeout(net.jt);net.names.host=m.host;net.last=Date.now();net.hb=setInterval(tick,4000);lst('');roomUI();vw('room')}
  else if(m.t==='deny')abortJoin(m.why||'Could not join.');
}
function guestMsg(m){
  net.last=Date.now();
  if(m.t==='start'){net.names=m.names;net.opts=m.opts||{cheats:false,ice:false};startMatch()}
  else if(m.t==='opts'){net.opts=m.opts;roomUI()}
  else if(m.t==='aim')gotAim(m);
  else if(m.t==='shot')startRemote(m);
  else if(m.t==='result')onResult(m);
  else if(m.t==='tmo')applyTmo(m);
  else if(m.t==='closed')hostGone('left');
}
function abortJoin(t){const n=net;net=null;clearTimeout(n.jt);try{n.cl.unsubscribe([NP+'join/'+n.id+'/'+n.cid,NP+'out/'+n.id])}catch(e){}lst(t)}
function guestGone(why){
  const was=net.playing&&!net.over;
  net.guest=null;net.names.guest='';net.waiting=false;net.pending=null;
  if(was){net.over=true;rolling=false;showOver('Opponent '+why+' - you win!',backToRoom)}else net.playing=false;
  pubLobby();roomUI();
}
function hostGone(why){
  const was=net.playing&&!net.over;
  leaveSession(false);rolling=false;
  if(was)showOver('The host '+why+' - you win!',()=>{ovShow('lob',true);vw('home')});
  else{ovShow('lob',true);vw('home');lst('The host '+why+'.')}
}
function leaveSession(notify=true){
  if(!net)return;
  const n=net;net=null;clearInterval(n.hb);clearInterval(n.pub);clearTimeout(n.jt);
  try{
    if(n.me==='host'){
      if(notify)n.cl.publish(NP+'out/'+n.id,'{"t":"closed"}',{qos:1});
      n.cl.publish(NP+'lobbies/'+n.id,'',{qos:1,retain:true});const c=n.cl;setTimeout(()=>c.end(true),500);
    }else{
      if(notify)n.cl.publish(NP+'in/'+n.id,JSON.stringify({t:'leave',cid:n.cid}),{qos:1});
      n.cl.unsubscribe([NP+'join/'+n.id+'/'+n.cid,NP+'out/'+n.id]);
    }
  }catch(e){}
  document.body.classList.remove('online','cheatok');
  if(n.prevCheat!==undefined)setCheat(n.prevCheat);
  if(n.playing){rack();resize()}
}
// no auto-leave on page hide: switching apps to message your friend must not close your lobby
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&net)net.last=Date.now()});
function startMatch(){
  net.playing=true;net.turn='host';net.groups=null;net.inHand=true;net.brk=true;net.tmoN=0;net.tKey='';net.tEnd=0;net.tPause=0;net.opAim=null;net.firstDone=false;net.over=false;net.msg=((net.opts&&net.opts.tbt)?'Turn by turn. ':'')+((net.opts&&net.opts.timer==='rapid')?'Rapid timer. ':'')+((net.opts&&net.opts.trick)?'Trick shots only: bank it off a far wall. ':'');net.seq=0;net.pending=null;net.waiting=false;
  net.prevCheat=cheat;setCheat(!!(net.opts&&net.opts.cheats));
  rack();OX=OY=0;P=1;
  ovShow('lob',false);ovShow('menu',false);ovShow('over',false);
  document.body.classList.add('online');document.body.classList.toggle('cheatok',!!(net.opts&&net.opts.cheats));resize();kpos();spinUI();hudUpdate();
  pubLobby();
}
function backToRoom(){
  if(!net)return;
  net.playing=false;document.body.classList.remove('online','cheatok');
  if(net.prevCheat!==undefined)setCheat(net.prevCheat);
  resize();ovShow('lob',true);roomUI();vw('room');pubLobby();
}
function showOver(msg,next){$('omsg').textContent=msg;ovShow('over',true);$('ook').onclick=()=>{ovShow('over',false);if(next)next()}}
// ---- menu / lobby screens ----
function vw(v){
  view=v;
  for(const s of document.querySelectorAll('#lbox section'))s.classList.toggle('on',s.id==='v-'+v);
  $('ltitle').textContent={home:'Lobbies',create:'Create a lobby',list:'Join a lobby',room:'Lobby'}[v];
  if(v==='list')renderList();
}
function roomUI(){
  if(!net)return;
  const h=net.me==='host';
  $('rinfo').textContent=(net.lock?'\u{1F512} ':'')+net.lname;
  $('rplayers').textContent='Host: '+net.names.host+'\nGuest: '+(net.names.guest||'waiting for a player...');
  $('rstart').style.display=h?'':'none';$('rstart').disabled=!net.guest;
  const o=net.opts||(net.opts={cheats:false,ice:false});$('ocheat').checked=!!o.cheats;$('oice').checked=!!o.ice;$('otbt').checked=!!o.tbt;$('otimer').value=o.timer||'normal';$('otrick').checked=!!o.trick;$('ocheat').disabled=$('oice').disabled=$('otbt').disabled=$('otimer').disabled=$('otrick').disabled=!h;
  $('rmsg').textContent=h?(net.guest?'Ready - press Start!':'Waiting for your friend to join...'):'Waiting for the host to start...';
}
function renderList(){
  const L=$('llist'),now=Date.now();L.textContent='';let n=0;
  for(const m of br.map.values()){
    if(now-m.seen>45000)continue;n++;
    const full=m.n>=2||m.st!=='open',d=document.createElement('div'),a=document.createElement('b'),b=document.createElement('span');
    d.className='li'+(full?' full':'');a.style.flex='1';
    a.textContent=(m.lock?'\u{1F512} ':'')+m.name;b.textContent=m.host+' - '+(m.st==='playing'?'in game':m.n+'/2');
    d.appendChild(a);d.appendChild(b);if(!full)d.onclick=()=>pickLobby(m);L.appendChild(d);
  }
  if(!n)L.textContent='No lobbies yet. Ask your friend to create one.';
}
setInterval(()=>{if(view==='list')renderList()},2000);
function pickLobby(m){
  if(net)return;
  if(m.lock){pend=m;$('lpwbox').style.display='flex';$('jpw').value='';$('jpw').focus&&$('jpw').focus()}else joinLobby(m,'');
}
async function joinLobby(m,pw){
  if(net||!br.cl)return;
  const cid=rnd(10),id=m.id,cl=br.cl;
  net={me:'guest',id,cid,cl,lname:m.name,lock:!!m.lock,names:{host:m.host,guest:myName()},playing:false,last:Date.now(),seq:0,pre:{},pending:null,joined:false};
  cl.subscribe([NP+'join/'+id+'/'+cid,NP+'out/'+id],{qos:1});
  lst('Joining...');
  const pwh=m.lock?await sha(id+':'+pw):'';
  if(!net)return;
  sendIn({t:'join',name:net.names.guest,pw:pwh});
  net.jt=setTimeout(()=>{if(net&&!net.joined)abortJoin('No answer from the host.')},8000);
}
$('mplay').onclick=()=>ovShow('menu',false);
$('mlob').onclick=()=>{ovShow('lob',true);vw(net?'room':'home')};
$('lback').onclick=()=>{
  lst('');
  if(view==='home'){ovShow('lob',false);return}
  if(view==='room'){leaveSession(true);vw('home');return}
  if(view==='list'&&br.cl){try{br.cl.unsubscribe(NP+'lobbies/+')}catch(e){}$('lpwbox').style.display='none'}
  vw('home');
};
$('lcreate').onclick=()=>{vw('create');if(!$('cname').value)$('cname').value=myName()+"'s lobby"};
$('cgo').onclick=async()=>{
  if(net)return;
  const name=($('cname').value||'').trim().slice(0,24)||'Lobby',pw=$('cpw').value,id=rnd(8),hn=myName();
  lst('Connecting...');
  try{
    const cl=await getClient({topic:NP+'lobbies/'+id,payload:'',qos:1,retain:true});
    net={me:'host',id,cl,lname:name,lock:!!pw,pwh:pw?await sha(id+':'+pw):'',names:{host:hn,guest:''},guest:null,playing:false,last:Date.now(),seq:0,pre:{},pending:null};
    cl.subscribe(NP+'in/'+id,{qos:1});
    pubLobby();net.hb=setInterval(tick,4000);net.pub=setInterval(pubLobby,15000);
    lst('');roomUI();vw('room');
  }catch(e){lst(OFFLINE)}
};
$('ljoin').onclick=async()=>{
  vw('list');lst('Connecting...');br.map.clear();
  try{
    if(!br.cl)br.cl=await getClient();
    br.cl.subscribe(NP+'lobbies/+',{qos:1});lst('');renderList();
  }catch(e){lst(OFFLINE)}
};
$('jgo').onclick=()=>{if(pend){$('lpwbox').style.display='none';joinLobby(pend,$('jpw').value)}};
$('rstart').onclick=()=>{
  if(!net||net.me!=='host'||!net.guest)return;
  net.opts=net.opts||{cheats:false,ice:false};sendOut({t:'start',names:net.names,opts:net.opts});startMatch();
};
$('ocheat').onchange=$('oice').onchange=$('otbt').onchange=$('otimer').onchange=$('otrick').onchange=()=>{if(!net||net.me!=='host'||net.playing)return;net.opts={cheats:$('ocheat').checked,ice:$('oice').checked,tbt:$('otbt').checked,timer:$('otimer').value,trick:$('otrick').checked};if(net.guest)sendOut({t:'opts',opts:net.opts})};
$('mn').onclick=e=>{
  const b=$('mn');
  if(net&&net.playing&&!net.over&&!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to forfeit';setTimeout(()=>{delete b.dataset.c;b.textContent='Menu'},3000);return}
  delete b.dataset.c;b.textContent='Menu';
  if(net)leaveSession(true);
  ovShow('lob',false);ovShow('over',false);ovShow('menu',true);
};
new ResizeObserver(()=>{resize();kpos()}).observe(document.body);onresize=resize;
let lastRenew=0;
function heal(){buildBg();drawWheel();kpos();dirty=true}
// Phones can drop a canvas' drawing surface while the app is in the background.
// renew() throws the canvases away and creates fresh ones (game state lives in JS, so nothing is lost).
function renew(){
  const now=Date.now();if(now-lastRenew<400)return;lastRenew=now;
  for(const id of ['c','wheel']){
    const o=$(id),n=document.createElement('canvas');
    n.id=id;
    for(const k of ['onpointerdown','onpointermove','onpointerup','onpointercancel','onwheel'])n[k]=o[k];
    o.replaceWith(n);
  }
  SP.length=0;cv=$('c');cx=cv.getContext('2d');wv=$('wheel');wc=wv.getContext('2d');bgc=document.createElement('canvas');
  watch();resize();kpos();dirty=true;
}
function watch(){for(const c of [cv,wv])for(const n of ['contextlost','contextrestored'])c.addEventListener(n,e=>{e.preventDefault();renew()})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renew()});
addEventListener('pageshow',renew);
watch();
rack();resize();applySet();kpos();spinUI();requestAnimationFrame(loop);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('pointerdown',()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}},{once:true});
