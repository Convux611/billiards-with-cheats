<!DOCTYPE html>

<title>Sandbox Pool</title>
<style>
:root{--bg:#f2f2ee;--fg:#1c1c1a;--bt:#fff;--bd:#c9c9c2;--ac:#1d7a46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#17181a;--fg:#e8e8e4;--bt:#26282b;--bd:#3a3d41;--ac:#2f9d5f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{position:relative;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:absolute;left:0;top:0;box-sizing:border-box;display:flex;flex-direction:column;transform-origin:0 0;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.rot #app{padding:0}
#bar{flex:none;display:flex;gap:6px;padding:6px;justify-content:center;overflow-x:auto}
button{flex:none;white-space:nowrap;background:var(--bt);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:inherit}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#row{display:flex;gap:8px;align-items:flex-start}
canvas{touch-action:none;display:block}
#pwr{width:56px;display:flex;flex-direction:column;align-items:center;gap:4px}
#trk{flex:1;min-height:0;width:30px;position:relative;border-radius:15px;background:var(--bt);border:1px solid var(--bd);touch-action:none}
#fill{position:absolute;inset:0;border-radius:15px;background:linear-gradient(#3fbf6f,#e8c33a,#d9482b);clip-path:inset(0 0 100% 0)}
#knob{position:absolute;left:50%;top:0;width:54px;height:42px;margin-left:-27px;border-radius:12px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;touch-action:none;font-size:20px;transition:top .15s}
#knob.dg{transition:none}
#pl{font-size:12px;opacity:.55;min-width:38px;text-align:center}
#wheel{width:56px;border-radius:14px;background:#0b0b0b;border:1px solid #333;box-sizing:border-box}
</style></head><body>
<div id="app">
<div id="bar"><button id="ch" class="on">Cheat: ON</button><button id="un">Undo</button><button id="rs">Reset</button><button id="mv">Move: OFF</button><button id="sn" class="on">Sound</button></div>
<div id="wrap"><div id="row">
<div id="pwr"><div id="trk"><div id="fill"></div><div id="knob">&#8801;</div></div><div id="pl">50%</div></div>
<canvas id="c"></canvas>
<canvas id="wheel"></canvas>
</div></div>
</div>
<script>
const W=880,H=440,R=10,M=40,LW=W+2*M,LH=H+2*M,DT=1/240,FC=.8,FA=30,STOP=6,EB=.96,EC=.78,VMAX=1800,MAXS=240*14;
const PK=[[0,0,20],[W,0,20],[0,H,20],[W,H,20],[W/2,0,17],[W/2,H,17]];
const COL=['#f5f5f0','#f2c500','#1f4fd8','#d62828','#7b2cbf','#f77f00','#1b9a4a','#8c1c13','#161616','#f2c500','#1f4fd8','#d62828','#7b2cbf','#f77f00','#1b9a4a','#8c1c13'];
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d');
let balls,undo=null,cheat=true,moveMode=false,rolling=false,ang=0,dirty=true,pv=null,drag=null,s=1,rot=false,dpr=1,P=1,st=null,sd=null,fx=[],mute=false,evs=[];
const mk=(id,x,y)=>({id,x,y,vx:0,vy:0,out:false});
function rack(){
  balls=[mk(0,W*.25,H/2)];
  const q=[1,9,2,10,8,3,11,4,12,6,5,13,7,14,15];let k=0;
  for(let r=0;r<5;r++)for(let i=0;i<=r;i++)balls.push(mk(q[k++],W*.7+r*(R*1.7320508+.3),H/2+(i-r/2)*(2*R+.6)));
  rolling=false;st=null;fx=[];undo=null;dirty=true;
}
// One physics step. Used by BOTH the live game and the preview, so they always agree.
function step(bs,ev){
  for(const b of bs){
    if(b.out||!(b.vx||b.vy))continue;
    b.x+=b.vx*DT;b.y+=b.vy*DT;
    const sp=Math.hypot(b.vx,b.vy),n=sp*(1-FC*DT)-FA*DT;
    if(n<=STOP){b.vx=b.vy=0}else{const k=n/sp;b.vx*=k;b.vy*=k}
    for(const p of PK){const dx=b.x-p[0],dy=b.y-p[1];if(dx*dx+dy*dy<p[2]*p[2]){if(ev)ev.push([2,sp,b.id,p[0],p[1],b.x,b.y]);b.out=true;b.vx=b.vy=0;break}}
    if(b.out)continue;
    if(b.x<R){if(ev&&b.vx<-40)ev.push([1,-b.vx]);b.x=R;b.vx=Math.abs(b.vx)*EC}else if(b.x>W-R){if(ev&&b.vx>40)ev.push([1,b.vx]);b.x=W-R;b.vx=-Math.abs(b.vx)*EC}
    if(b.y<R){if(ev&&b.vy<-40)ev.push([1,-b.vy]);b.y=R;b.vy=Math.abs(b.vy)*EC}else if(b.y>H-R){if(ev&&b.vy>40)ev.push([1,b.vy]);b.y=H-R;b.vy=-Math.abs(b.vy)*EC}
  }
  for(let i=0;i<bs.length;i++){
    const a=bs[i];if(a.out)continue;
    for(let j=i+1;j<bs.length;j++){
      const b=bs[j];if(b.out||!(a.vx||a.vy||b.vx||b.vy))continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2>=4*R*R||d2===0)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(2*R-d)/2;
      a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
      const vn=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(vn>0){if(ev&&vn>30)ev.push([0,vn]);const j2=(1+EB)/2*vn;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny}
    }
  }

  return false;
}
function preview(){
  const sim=balls.map(b=>({...b})),c=sim[0];
  if(c.out)return null;
  const sp=VMAX*P;c.vx=Math.cos(ang)*sp;c.vy=Math.sin(ang)*sp;
  const T=sim.map(b=>[[b.x,b.y]]);
  const rec=()=>sim.forEach((b,i)=>{const p=T[i],l=p[p.length-1];
    if((!b.out||!b.rd)&&Math.hypot(b.x-l[0],b.y-l[1])>=2){p.push([b.x,b.y]);if(b.out)b.rd=1}});
  for(let n=1;n<=MAXS;n++){const m=step(sim);if(n%3===0||!m)rec();if(!m)break}
  return{P:T,sim};
}
function settle(){
  const c=balls[0];
  if(c.out){c.out=false;c.vx=c.vy=0;let x=W*.25;c.x=x;c.y=H/2;
    while(x>R+1&&balls.some(b=>b!==c&&!b.out&&Math.hypot(b.x-x,b.y-c.y)<2*R+1)){x-=R;c.x=x}}
  dirty=true;
}
function fire(p){
  if(rolling||balls[0].out)return;
  undo=balls.map(b=>({...b}));
  const c=balls[0],sp=VMAX*p;
  c.vx=Math.cos(ang)*sp;c.vy=Math.sin(ang)*sp;rolling=true;snd(3,p);P=1;kpos();
}
function drawBall(id,x,y){
  cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(x+2.5,y+3.5,R,R*.92,0,0,7);cx.fill();
  cx.beginPath();cx.arc(x,y,R,0,7);cx.fillStyle=id>8?'#f5f5f0':COL[id];cx.fill();
  if(id>8){cx.save();cx.beginPath();cx.arc(x,y,R,0,7);cx.clip();cx.fillStyle=COL[id];cx.fillRect(x-R,y-R*.55,2*R,R*1.1);cx.restore()}
  if(id){cx.beginPath();cx.arc(x,y,4.2,0,7);cx.fillStyle='#fff';cx.fill();
    cx.fillStyle='#000';cx.font='bold 6px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(id,x,y+.3)}
  const g=cx.createRadialGradient(x-R*.35,y-R*.4,R*.1,x,y,R);
  g.addColorStop(0,'rgba(255,255,255,.65)');g.addColorStop(.3,'rgba(255,255,255,.08)');g.addColorStop(.75,'rgba(0,0,0,.12)');g.addColorStop(1,'rgba(0,0,0,.5)');
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,R,0,7);cx.fill();
}
function draw(){
  cx.setTransform(s*dpr,0,0,s*dpr,0,0);
  cx.drawImage(bgc,0,0,LW,LH);
  cx.translate(M,M);
  const c=balls[0],aiming=!rolling&&!c.out,dx=Math.cos(ang),dy=Math.sin(ang);
  if(aiming){
    if(cheat&&pv){
      pv.P.forEach((p,i)=>{
        if(p.length<2)return;
        const id=pv.sim[i].id,col=id===8?'#444':COL[id];
        cx.strokeStyle=col;cx.lineWidth=id?2:2.5;cx.globalAlpha=.9;
        cx.beginPath();cx.moveTo(p[0][0],p[0][1]);for(const q of p)cx.lineTo(q[0],q[1]);cx.stroke();
        const e=p[p.length-1];cx.globalAlpha=1;
        if(pv.sim[i].out){cx.fillStyle=col;cx.beginPath();cx.arc(e[0],e[1],5,0,7);cx.fill()}
        else{cx.setLineDash([3,3]);cx.beginPath();cx.arc(e[0],e[1],R,0,7);cx.stroke();cx.setLineDash([])}
      });
    }else{
      cx.strokeStyle='rgba(255,255,255,.6)';cx.lineWidth=1.5;cx.setLineDash([6,6]);
      cx.beginPath();cx.moveTo(c.x,c.y);cx.lineTo(c.x+dx*160,c.y+dy*160);cx.stroke();cx.setLineDash([]);
    }
  }
  for(const b of balls)if(!b.out)drawBall(b.id,b.x,b.y);
  drawFx();
  if(aiming){
    let pull=R+3+((sd||st)?P:.1)*55;if(st)pull=R+3+(pull-R-3)*(1-st.t/.08);
    const ax=c.x-dx*pull,ay=c.y-dy*pull,bx=c.x-dx*(pull+260),by=c.y-dy*(pull+260),nx=-dy,ny=dx,gr=cx.createLinearGradient(ax,ay,bx,by);
    gr.addColorStop(0,'#7fa6d6');gr.addColorStop(.025,'#f2efe6');gr.addColorStop(.06,'#ecd29a');gr.addColorStop(.6,'#c4894a');gr.addColorStop(1,'#3b2212');
    cx.fillStyle=gr;cx.beginPath();cx.moveTo(ax+nx*1.8,ay+ny*1.8);cx.lineTo(bx+nx*3.8,by+ny*3.8);cx.lineTo(bx-nx*3.8,by-ny*3.8);cx.lineTo(ax-nx*1.8,ay-ny*1.8);cx.closePath();cx.fill();
  }
}
let ac=null,nb=null;
function A(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate*.4|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;nb=b}if(ac.state==='suspended')ac.resume()}catch(e){ac=null}return ac}
function tone(f0,f1,dur,vol,type){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(Math.max(.002,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,ft,f0,f1){const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type=ft;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(Math.max(.002,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+dur+.02)}
function snd(k,v){
  if(mute||!A())return;
  const a=Math.min(1,v/1000);
  if(k===0){const f=2200+Math.random()*500;tone(f,f*.6,.05,.05+.3*a,'sine');noise(.03,.05+.35*a,'highpass',3000,5000)}
  else if(k===1){tone(150,70,.09,.1+.4*a,'sine');noise(.05,.03+.12*a,'lowpass',1200,400)}
  else if(k===2){tone(220,60,.28,.45,'sine');noise(.35,.25,'lowpass',1800,200);setTimeout(()=>{if(ac)tone(900,500,.06,.1,'triangle')},120)}
  else{tone(1500,900,.04,.1+.35*v,'sine');noise(.04,.1+.4*v,'highpass',1500,3000);tone(120,60,.1,.1+.3*v,'sine')}
}
function burst(e){
  const[,sp,id,px,py,bx,by]=e,c=id===0?'#f5f5f0':id===8?'#9a9a9a':COL[id];
  fx.push({k:'s',id,x0:bx,y0:by,x1:px,y1:py,t:0},{k:'r',x:px,y:py,c,t:0});
  const n=16+Math.min(sp,1000)/50|0;
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=60+Math.random()*(140+sp*.12),l=.45+Math.random()*.5;
    fx.push({k:'p',x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l,m:l,r:1.5+Math.random()*2.5,c:Math.random()<.3?'#fff':c})}
}
function fxEvents(){
  const top=(k,n)=>evs.filter(e=>e[0]===k).sort((a,b)=>b[1]-a[1]).slice(0,n);
  top(0,5).forEach(e=>snd(0,e[1]));top(1,2).forEach(e=>snd(1,e[1]));
  for(const e of evs)if(e[0]===2){snd(2,e[1]);burst(e)}
}
function fxUpdate(dt){
  for(const f of fx){
    if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=1-3*dt;f.vy*=1-3*dt;f.l-=dt}else f.t+=dt;
  }
  fx=fx.filter(f=>f.k==='p'?f.l>0:f.t<(f.k==='s'?.25:.45));
}
function drawFx(){
  for(const f of fx){
    if(f.k==='p'){cx.globalAlpha=Math.max(0,f.l/f.m);cx.fillStyle=f.c;cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()}
    else if(f.k==='r'){const u=f.t/.45;cx.globalAlpha=1-u;cx.strokeStyle=f.c;cx.lineWidth=3;cx.beginPath();cx.arc(f.x,f.y,12+u*40,0,7);cx.stroke()}
    else{const u=Math.min(1,f.t/.25);cx.save();cx.translate(f.x0+(f.x1-f.x0)*u,f.y0+(f.y1-f.y0)*u);cx.scale(1-u*.8,1-u*.8);drawBall(f.id,0,0);cx.restore()}
  }
  cx.globalAlpha=1;
}
let last=0,acc=0;
function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(st){st.t+=dt;if(st.t>=.08){const p=st.p;st=null;fire(p)}}
  if(rolling){
    evs.length=0;acc+=dt;
    while(acc>=DT){acc-=DT;if(!step(balls,evs)){rolling=false;acc=0;settle();break}}
    fxEvents();
  }
  fxUpdate(dt);
  if(dirty&&!rolling){pv=cheat?preview():null;dirty=false}
  draw();requestAnimationFrame(loop);
}
function pos(e){
  const r=cv.getBoundingClientRect();
  return rot?[(e.clientY-r.top)/s-M,(r.right-e.clientX)/s-M]:[(e.clientX-r.left)/s-M,(e.clientY-r.top)/s-M];
}
cv.onpointerdown=e=>{
  if(rolling||st)return;cv.setPointerCapture(e.pointerId);
  const[x,y]=pos(e);
  if(moveMode){
    let best=null,bd=1.8*R;
    for(const b of balls)if(!b.out){const d=Math.hypot(b.x-x,b.y-y);if(d<bd){bd=d;best=b}}
    drag=best;
  }else{drag='aim';ang=Math.atan2(y-balls[0].y,x-balls[0].x);dirty=true}
};
cv.onpointermove=e=>{
  if(rolling||st)return;const[x,y]=pos(e);
  if(drag&&drag!=='aim'){
    const nx=Math.min(W-R,Math.max(R,x)),ny=Math.min(H-R,Math.max(R,y));
    if(!PK.some(p=>Math.hypot(nx-p[0],ny-p[1])<p[2]+R)&&!balls.some(o=>o!==drag&&!o.out&&Math.hypot(o.x-nx,o.y-ny)<2*R)){drag.x=nx;drag.y=ny;dirty=true}
  }else if(!moveMode&&(drag==='aim'||e.pointerType==='mouse')){
    ang=Math.atan2(y-balls[0].y,x-balls[0].x);dirty=true;
  }

cv.onpointerup=cv.onpointercancel=()=>{drag=null};
$('ch').onclick=e=>{cheat=!cheat;e.target.classList.toggle('on',cheat);e.target.textContent='Cheat: '+(cheat?'ON':'OFF');dirty=true};
$('sn').onclick=e=>{mute=!mute;e.target.classList.toggle('on',!mute);e.target.textContent=mute?'Muted':'Sound'};
addEventListener('pointerdown',()=>A());
const trk=$('trk'),knob=$('knob'),fill=$('fill'),pl=$('pl');
function kpos(){
  const tl=trk.clientHeight,kl=knob.offsetHeight,L=tl-kl,f=sd?sd.k:0;
  knob.style.top=f*L+'px';
  fill.style.clipPath='inset(0 0 '+(sd?100-(f*L+kl/2)/tl*100:100)+'% 0)';
  pl.textContent=Math.round(P*100)+'%';pl.style.opacity=sd?1:.55;
}
knob.onpointerdown=e=>{
  if(rolling||st||sd)return;
  knob.setPointerCapture(e.pointerId);
  sd={y:e.clientY,x:e.clientX,k:0,m:0,P0:P,id:e.pointerId};knob.classList.add('dg');
};
knob.onpointermove=e=>{
  if(!sd||e.pointerId!==sd.id)return;
  sd.k=Math.min(1,Math.max(0,(rot?sd.x-e.clientX:e.clientY-sd.y)/(trk.clientHeight-knob.offsetHeight)));
  sd.m=1;P=sd.k;dirty=true;kpos();
};
knob.onpointerup=knob.onpointercancel=e=>{
  if(!sd||e.pointerId!==sd.id)return;
  const d=sd;sd=null;knob.classList.remove('dg');
  if(e.type==='pointerup'&&d.m&&d.k>=.03&&!rolling&&!st&&!balls[0].out){P=d.k;st={t:0,p:d.k}}else P=d.P0;
  dirty=true;kpos();
};
$('un').onclick=()=>{if(undo&&!rolling){balls=undo;undo=null;dirty=true}};
$('rs').onclick=rack;
$('mv').onclick=e=>{moveMode=!moveMode;e.target.classList.toggle('on',moveMode);e.target.textContent='Move: '+(moveMode?'ON':'OFF')};
onkeydown=e=>{if(e.key==='ArrowLeft'){ang-=.002;dirty=true}else if(e.key==='ArrowRight'){ang+=.002;dirty=true}};
const bgc=document.createElement('canvas');
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function buildBg(){
  bgc.width=cv.width;bgc.height=cv.height;
  const g=bgc.getContext('2d');g.setTransform(s*dpr,0,0,s*dpr,0,0);
  let gr=g.createLinearGradient(0,0,0,LH);gr.addColorStop(0,'#855130');gr.addColorStop(.5,'#5e3719');gr.addColorStop(1,'#3d230f');
  rr(g,0,0,LW,LH,26);g.fillStyle=gr;g.fill();
  rr(g,2,2,LW-4,LH-4,24);g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=2;g.stroke();
  g.save();g.translate(M,M);
  rr(g,-14,-14,W+28,H+28,8);g.fillStyle='#0d5a35';g.fill();g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=2;g.stroke();
  gr=g.createRadialGradient(W/2,H/2,30,W/2,H/2,W*.62);gr.addColorStop(0,'#27a063');gr.addColorStop(1,'#13693e');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.beginPath();g.rect(0,0,W,H);g.clip();g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=10;g.strokeRect(0,0,W,H);g.restore();
  g.fillStyle='rgba(255,255,255,.2)';g.fillRect(W*.25-.5,0,1,H);
  for(const x of [W*.25,W*.7]){g.beginPath();g.arc(x,H/2,2.5,0,7);g.fill()}
